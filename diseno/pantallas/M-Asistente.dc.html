.tag-ph{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);color:#FFFFFF;font-family:'Exo 2',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em}

.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid #E6E6E6;background:#FFFFFF;color:#00475D;font-family:'Exo 2',Arial,sans-serif;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:#00475D}
.field{display:flex;flex-direction:column;gap:8px;font-family:'Exo 2',Arial,sans-serif;font-weight:600;font-size:14px;color:#00475D}
.field input,.field select,.field textarea{height:52px;border-radius:14px;border:1.5px solid #E6E6E6;padding:0 16px;font-family:Arial,Arimo,sans-serif;font-size:16px;color:#00475D;background:#FFFFFF;width:100%}
.field textarea{height:120px;padding:14px 16px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#3F809C;box-shadow:0 0 0 4px rgba(63,128,156,.15)}
.crumb{font-size:13px;color:#6B7075;display:flex;gap:8px;flex-wrap:wrap}.crumb a{color:#336E88;text-decoration:none}
.prod{position:relative;display:flex;flex-direction:column;border-radius:20px;background:#FFFFFF;border:1px solid #E6E6E6;overflow:hidden;transition:transform .25s,box-shadow .25s;text-decoration:none;color:inherit}
.prod:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,71,93,.12)}
.prod .pimg{position:relative;height:230px;display:flex;align-items:flex-end;justify-content:center;border-radius:0}
.prod .pimg img{height:210px;width:auto;max-width:88%;object-fit:contain;transition:transform .35s}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-family:'Exo 2',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em}
.fopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 0;background:none;border:0;font:inherit;font-size:15px;color:#4E5258;cursor:pointer;text-align:left;min-height:40px}
.fopt:hover{color:#00475D}
.acc{border-bottom:1px solid #E6E6E6}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;background:none;border:0;font-family:'Exo 2',Arial,sans-serif;font-weight:700;font-size:19px;color:#00475D;cursor:pointer;text-align:left}
.prose p{margin:0 0 22px;font-size:18px;line-height:1.75;color:#4E5258}
.prose h2{font-family:'Exo 2',Arial,sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;color:#00475D;margin:44px 0 16px;line-height:1.1}
.prose ul{margin:0 0 22px;padding-left:22px;font-size:18px;line-height:1.75}
.m .wrap{padding:0 20px}
.m .h2{font-size:38px}

.lift{transition:transform .2s}.lift:hover{transform:translateY(-6px)}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px}

</style>

<div style="min-height: 844px; background: #062A33; color: #FFFFFF; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px"><a href="M-Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><span class="eyebrow" style="color: #89E462">Asistente PyH+</span><a href="M-Inicio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>

<div style="display: flex; gap: 6px"><span style="{{ bar1 }}"></span><span style="{{ bar2 }}"></span><span style="{{ bar3 }}"></span></div>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 0, answers: [] }; }
  renderVals() {
    const Q = [
      { q: '¿Dónde vas a trabajar?', o: [['Interior', 'Bodegas, centros comerciales, piso liso.'], ['Exterior', 'Obra, fachadas, terreno irregular.'], ['Ambos', 'Un poco de todo.'], ['No estoy seguro', 'Te ayudamos a definirlo.']] },
      { q: '¿A qué altura necesitas llegar?', o: [['Hasta 8 m', 'Techos de bodega, vitrinas.'], ['De 8 a 15 m', 'Naves industriales, fachadas bajas.'], ['De 15 a 25 m', 'Edificios, tarimas.'], ['Más de 25 m', 'Grandes alturas, hasta 43 m.']] },
      { q: '¿Qué vas a hacer arriba?', o: [['Mantenimiento', 'Cableado, ductos, iluminación.'], ['Fachadas', 'Limpieza, pintura, vidrios.'], ['Eventos', 'Tarimas, vallas, montajes.'], ['Bodegaje', 'Racks, inventarios.']] }
    ];
    const s = this.state.step;
    const a = this.state.answers;
    const bar = (n) => 'flex: 1; height: 6px; border-radius: 3px; background: ' + (n <= s + 1 ? '#89E462' : '#00313F');
    const cur = Q[Math.min(s, 2)];
    const opts = cur.o.map((x, i) => ({
      label: x[0], desc: x[1],
      style: (a[s] === i ? 'background: #00313F; border: 2px solid #89E462;' : 'background: transparent; border: 1px solid #00313F;'),
      pick: () => { const na = a.slice(); na[s] = i; this.setState({ answers: na, step: s + 1 }); }
    }));
    const h = a[1];
    let result = 'Tijera eléctrica de 12 m';
    let why = 'Interior, piso liso y altura media: sube recto, no marca el piso y cabe por puertas estándar.';
    if (h === 2) { result = 'Brazo articulado de 20 m'; why = 'Esquiva obstáculos y llega a fachadas y estructuras medianas.'; }
    if (h === 3) { result = 'Brazo telescópico de 43 m'; why = 'El máximo alcance de nuestra flota, ideal para grandes alturas.'; }
    if (h === 0) { result = 'Unipersonal de 8 m'; why = 'Liviana y angosta: entra en pasillos y espacios estrechos.'; }
    return {
      asking: s < 3, done: s >= 3, stepNum: Math.min(s + 1, 3), question: cur.q, opts,
      bar1: bar(1), bar2: bar(2), bar3: bar(3), result, resultWhy: why,
      back: () => this.setState({ step: Math.max(0, s - 1) }),
      reset: () => this.setState({ step: 0, answers: [] })
    };
  }
}
</script>
