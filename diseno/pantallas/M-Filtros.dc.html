      name: p.n, fam: p.fam, img: p.img, href: 'M-Detalle.dc.html',
      bg: 'background: transparent;',
      imgStyle: 'height: ' + p.ih + 'px;',
      mImgStyle: 'height: ' + Math.round(p.ih * 0.56) + 'px;',
      famStyle: p.bg === '#00475D' ? 'color: #89E462;' : 'color: #46772A;',
      height: p.h + ' m', ene: p.e, cap: p.cap, marca: p.m, ter: p.t.join(' y '),
      mod: p.mod.join(' · '), price: p.price,
      hasBadge: !!p.badge, badge: p.badge,
      stock: p.stock,
      stockDot: 'width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: ' + (p.stock === 'Disponible hoy' ? '#609839' : (p.stock === 'Bajo reserva' ? '#A6A6A6' : '#FFD406')) + ';'
    }));
    const applied = [];
    G.forEach(g => sel[g[0]].forEach(l => applied.push({ label: l, remove: toggle(g[0], l) })));
    const sOpt = (k, l) => ({ label: l, pick: () => this.setState({ sort: k }), style: sort === k ? 'background: #00475D; color: #FFFFFF; border-color: #00475D;' : '' });
    const n = results.length;
    return Object.assign({
      gFam: groups.fam, gAlt: groups.alt, gEne: groups.ene, gTer: groups.ter, gMarca: groups.marca, gMod: groups.mod,
      results: results, count: n, countL: n === 1 ? '1 resultado' : n + ' resultados',
      seeL: 'Ver ' + n + (n === 1 ? ' resultado' : ' resultados'),
      hasResults: n > 0, noResults: n === 0,
      applied: applied, hasApplied: applied.length > 0, nApplied: applied.length ? '(' + applied.length + ')' : '',
      clear: () => this.setState({ sel: { fam: [], alt: [], ene: [], ter: [], marca: [], mod: [] } }),
      sorts: [sOpt('rel', 'Más relevantes'), sOpt('asc', 'Menor altura'), sOpt('desc', 'Mayor altura')]
    });
  }
}
</script>
